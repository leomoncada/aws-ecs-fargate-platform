# Production promotion only. Staging deploys live in ci.yml, gated on the
# build job, so a deploy can never race the image it is supposed to deploy.
name: Promote to production

on:
  push:
    branches: [prod]

concurrency:
  group: promote-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The staging tag is mutable. Resolve it to an immutable digest once,
      # up front, and use that digest for every subsequent step so the whole
      # promotion refers to one artefact we can name afterwards.
      - name: Resolve staging digests
        id: resolve
        run: |
          set -euo pipefail
          for app in backend frontend; do
            case "$app" in
              backend)  repo="${{ secrets.ECR_REPOSITORY_BACKEND }}" ;;
              frontend) repo="${{ secrets.ECR_REPOSITORY_FRONTEND }}" ;;
            esac
            digest=$(aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids imageTag=staging \
              --query 'imageDetails[0].imageDigest' \
              --output text)
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::could not resolve a digest for $repo:staging (got '$digest')"
              exit 1
            fi
            echo "${app}=${digest}" >> "$GITHUB_OUTPUT"
            echo "- ${app}: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Promote images by digest
        run: |
          set -euo pipefail
          promote() {
            local repo="$1" digest="$2"
            manifest=$(aws ecr batch-get-image \
              --repository-name "$repo" \
              --image-ids imageDigest="$digest" \
              --query 'images[0].imageManifest' \
              --output text)
            aws ecr put-image \
              --repository-name "$repo" \
              --image-tag prod \
              --image-manifest "$manifest"
          }
          promote "${{ secrets.ECR_REPOSITORY_BACKEND }}"  "${{ steps.resolve.outputs.backend }}"
          promote "${{ secrets.ECR_REPOSITORY_FRONTEND }}" "${{ steps.resolve.outputs.frontend }}"

      - name: Deploy services
        run: |
          set -euo pipefail
          for svc in "${{ secrets.ECS_SERVICE_BACKEND_PROD }}" \
                     "${{ secrets.ECS_SERVICE_FRONTEND_PROD }}"; do
            aws ecs update-service \
              --cluster "${{ secrets.ECS_CLUSTER_PROD }}" \
              --service "$svc" \
              --force-new-deployment \
              --region "${{ env.AWS_REGION }}"
          done

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER_PROD }}" \
            --services "${{ secrets.ECS_SERVICE_BACKEND_PROD }}" \
                       "${{ secrets.ECS_SERVICE_FRONTEND_PROD }}" \
            --region "${{ env.AWS_REGION }}"
